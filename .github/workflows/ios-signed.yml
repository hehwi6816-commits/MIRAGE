name: Build, test, and export MIRAGE IPA

on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    
permissions:

  contents: read
  
jobs:

  build:
  
    runs-on: macos-15
    timeout-minutes: 40
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Extract MIRAGE source
      
        run: unzip -q MIRAGE-source.zip -d .
        
      - name: Apply Xcode 26 compatibility fix
      
        run: sed -i '' '90c\        for _ in 0..<asset.count { parent.addChildNode(SCNNode()) }' MIRAGE/Game/World.swift
        
      - name: Select Xcode
      
        uses: maxim-lobanov/setup-xcode@v1
        
        with:
        
          xcode-version: latest-stable
          
      - name: Install signing certificate and provisioning profile
      
        env:
        
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          
        run: |
        
          set -euo pipefail
          
          CERTIFICATE_PATH="$RUNNER_TEMP/signing_certificate.p12"
          
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          
          security create-keychain -p "" "$KEYCHAIN_PATH"
          
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          
          security default-keychain -s "$KEYCHAIN_PATH"
          
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          
      - name: Verify project builds on iOS Simulator
      
        run: xcodebuild -project MIRAGE.xcodeproj -scheme MIRAGE -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        
      - name: Archive and export signed IPA
      
        env:
        
          TEAM_ID: Z2K34A23A4
          
          BUNDLE_ID: com.dSu8.wg7A
          
        run: |
        
          set -euo pipefail
          
          rm -rf build
          
          xcodebuild -project MIRAGE.xcodeproj -scheme MIRAGE -configuration Release -destination 'generic/platform=iOS' -archivePath build/MIRAGE.xcarchive archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY='iPhone Distribution'
          
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          
          <?xml version="1.0" encoding="UTF-8"?>
          
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple




















































